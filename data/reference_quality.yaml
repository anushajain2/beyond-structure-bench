# Quality audit of every experimental reference in data/experimental/*.json (added in v1.1.0).
#
# One entry per material and property. Fields:
#   tier     core     : primary measurement or critically evaluated compilation, stated conditions,
#                       no unresolved conflict larger than its uncertainty
#            extended : usable but weaker (single secondary source, provisional compilation, thin film,
#                       unresolved conflict, missing term, ambiguous phase). Reported, but kept apart.
#   quality  primary | evaluated_compilation | compilation | provisional_compilation | secondary
#   kind     what the number is:
#            lattice      room_temperature | temperature_unstated
#            bulk_modulus adiabatic (ultrasonic/Brillouin/resonance) | isothermal (static EOS) | unspecified
#            thermal      point (alpha at stated T, or the derivative of a fit) |
#                         short_interval_mean (means over ~100 K intervals, assigned to midpoints) |
#                         range_average (one constant value over a wide range; NOT a value at 300 K)
#   sigma    1-sigma relative uncertainty used in the bootstrap (lattice: of the lattice constant).
#            From the source where it states one ("sigma_from: source"), otherwise the default
#            (lattice 0.001, bulk_modulus 0.05, thermal_expansion 0.10) or a value set by a documented
#            spread between sources ("sigma_from: spread").
#   why      the reason for the tier, in one line.
#
# Judgements are mine (2026-10-23), made from the notes and citations stored with each value, before
# looking at how they change any model's grade.

defaults: {lattice: 0.001, bulk_modulus: 0.05, thermal_expansion: 0.10}

