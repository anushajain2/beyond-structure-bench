  lattice: {tier: core, quality: evaluated_compilation, kind: room_temperature, sigma: 0.0001, sigma_from: source, why: "CODATA 2018 value at 22.5 °C"}
  bulk_modulus: {tier: core, quality: compilation, kind: adiabatic, why: "300 K single-crystal elastic constants (Ioffe)"}
  thermal_expansion: {tier: core, quality: evaluated_compilation, kind: point, sigma: 0.01, sigma_from: source, why: "Swenson's JPCRD recommended values; 900–1000 K extrapolated"}
