name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 && uv pip install -e ".[dev,mcp]"
      - run: uv run pytest -q
      - name: results and report rebuild from committed raw data
        run: uv run chipff analyze && uv run chipff report
