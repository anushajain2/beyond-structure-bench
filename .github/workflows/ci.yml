name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # pinned: uv 0.13.5 made `uv run` re-sync the environment before running, which on the
          # runner left `six.moves` unimportable (pandas -> dateutil); 0.13.3 was the last that passed
          version: "0.13.3"
      - run: uv venv --python 3.12 && uv pip install -e ".[dev,mcp]"
      # --no-sync: test the environment installed in the step above, as installed
      - run: uv run --no-sync pytest -q
      - name: results and report rebuild from committed raw data
        run: uv run --no-sync chipff analyze && uv run --no-sync chipff report
      - name: rebuilt tables equal the committed ones
        run: uv run --no-sync python scripts/check_reproducible.py --tables
  reproduce:
    # reruns one published result through the real model (MACE-MPA-0, Si lattice + EOS) and checks the numbers,
    # the code fingerprints and the model file's hash; a few minutes on the runner's CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.3"
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: uv run --no-sync python scripts/check_reproducible.py --recompute
